<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>เรียนภาษาไทย · 泰文字母入門</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <a href="#consonants">พยัญชนะ 子音</a>
      <a href="#vowels">สระ 母音</a>
      <a href="#tones">วรรณยุกต์ 聲調</a>
      <a href="#practice">ฝึกฝน 練習</a>
    </nav>

    <header>
      <h1>เรียนภาษาไทย</h1>
      <p>從零開始學泰文字母</p>
    </header>

    <section id="consonants">
      <h2>พยัญชนะ 子音</h2>

      <div class="legend">
        <span class="chip mid">中 Mid</span>
        <span class="chip low">低 Low</span>
        <span class="chip high">高 High</span>
      </div>

      <div class="grid-cons" id="consGrid"></div>
    </section>

    <section id="vowels">
      <h2>สระ 母音</h2>
      <p>(這裡之後會放母音表)</p>
    </section>

    <section id="tones">
      <h2>วรรณยุกต์ 聲調</h2>
      <p>(這裡之後會放五個聲調)</p>
    </section>

    <section id="practice">
      <h2>ฝึกฝน 練習</h2>
      <p>(這裡之後會放翻卡與小測驗)</p>
    </section>

    <script src="script.js"></script>
  </body>
</html>
